<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>innocentoath</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eeeeee;
    color: #333333;
    font-family: Arial, "Noto Sans SC", sans-serif;
    font-size: 12px;
    line-height: 1.7;
}

.page {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    background: #f8f8f8;
}

/* Profile */
.profile {
    position: relative;
    height: 135px;
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    border-bottom: 1px solid #ddd;
}

.profile::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.25);
}

.profile-content {
    position: absolute;
    z-index: 2;
    left: 18px;
    bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar-box {
    position: relative;
    width: 60px;
    height: 60px;
    flex-shrink: 0;
}

.avatar {
    position: absolute;
    left: 6px;
    top: 6px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid white;
    box-shadow: 0 1px 5px rgba(0,0,0,0.15);
    z-index: 1;
}

.avatar-decoration {
    position: absolute;
    left: 0;
    top: 0;
    width: 60px;
    height: 60px;
    object-fit: contain;
    z-index: 2;
    pointer-events: none;
}

.profile-name {
    background: rgba(255,255,255,0.75);
    padding: 3px 8px;
    font-size: 13px;
    letter-spacing: 0.5px;
}

/* Nav */
.nav {
    display: flex;
    justify-content: center;
    gap: 22px;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
    background: #fafafa;
}

.nav a {
    color: #666;
    text-decoration: none;
    font-size: 11px;
}

.nav a:hover {
    color: #111;
}

.nav a:not(:last-child)::after {
    content: "♡";
    margin-left: 22px;
    color: #aaa;
}

/* Content */
.content {
    padding: 18px 17px 50px;
}

/* Post */
.post {
    padding: 14px 0;
    border-bottom: 1px solid #ddd;
}

.post.pinned {
    background: #fffef5;
    padding: 14px 10px;
    border-left: 3px solid #f0c040;
}

.date {
    color: #999;
    font-size: 10px;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
}

.post-title {
    font-size: 13px;
    margin-bottom: 8px;
    font-weight: normal;
}

.post-text {
    color: #444;
    font-size: 11px;
    white-space: pre-line;
    word-break: break-word;
}

.post-text a {
    color: #5b8def;
    text-decoration: none;
}

.post-text a:hover {
    text-decoration: underline;
}

/* Post images */
.post-img {
    width: 100%;
    display: block;
    margin: 10px 0;
    border-radius: 2px;
}

.post-img.small {
    width: 65%;
}

/* Gallery */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
}

.gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    cursor: pointer;
}

/* About */
.about {
    text-align: center;
    padding: 15px 10px;
}

.about-avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 6px;
}

.about-name {
    font-size: 13px;
    margin-bottom: 8px;
}

.about-text {
    color: #777;
    font-size: 11px;
    line-height: 1.8;
}

/* Loading */
.loading {
    text-align: center;
    color: #aaa;
    font-size: 11px;
    padding: 20px 0;
}

/* Post tip */
.post-tip {
    text-align: center;
    color: #bbb;
    font-size: 10px;
    padding: 10px 0 0;
}

.post-tip a {
    color: #888;
    text-decoration: none;
}

.post-tip a:hover {
    text-decoration: underline;
}

/* Lightbox */
.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    justify-content: center;
    align-items: center;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}

.lightbox-close {
    position: absolute;
    top: 15px;
    right: 20px;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

@media (max-width: 480px) {
    .page { min-height: 100vh; }
    .content { padding-left: 15px; padding-right: 15px; }
}

</style>

</head>


<body>

<div class="profile">
    <div class="profile-content">
        <div class="avatar-box">
            <img class="avatar" src="avatar.jpg" alt="avatar">
            <img class="avatar-decoration" src="decoration.png" alt="">
        </div>
        <div class="profile-name">里里</div>
    </div>
</div>

<nav class="nav">
    <a href="#home">ホーム</a>
    <a href="#diary">日記</a>
    <a href="#gallery">写真</a>
    <a href="#about">プロフィール</a>
</nav>

<main class="content" id="post-list">

    <!-- 置顶 -->
    <section id="home">
    <article class="post pinned">
        <div class="date">PINNED</div>
        <h2 class="post-title">一则置顶</h2>
        <div class="post-text">一个很简单的个人博客（？<br>只是业余产物…</div>
    </article>
    </section>

    <!-- 帖子加载区 -->
    <div class="loading" id="loading">loading posts...</div>

    <!-- Gallery -->
    <section class="post" id="gallery">
        <div class="post-title">写真</div>
        <div class="gallery" id="gallery-grid">
            <div class="loading" id="gallery-loading">loading...</div>
        </div>
        <p class="post-tip">
            <a href="https://github.com/shioriame/innocentoath/upload/main/gallery" target="_blank">+ 上传图片</a>
        </p>
    </section>

    <!-- About -->
    <section class="post" id="about">
        <div class="about">
            <img class="about-avatar" src="avatar.jpg" alt="">
            <div class="about-name">未至千般恨不消</div>
            <div class="about-text">
                彼氏@都築誠<br>
                推し@taiga_himuro@taiganyaa
            </div>
        </div>
    </section>

   <!--
<p class="post-tip">
    <a href="https://github.com/shioriame/innocentoath/issues/new" target="_blank">+ 发新帖</a>
</p>
-->

</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('active')">×</span>
    <img id="lightbox-img" src="" alt="">
</div>

<script>

const REPO = 'shioriame/innocentoath';
const POST_LIST = document.getElementById('post-list');
const LOADING = document.getElementById('loading');

// Markdown → HTML
function md2html(text) {
    if (!text) return '';
    let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/!\[.*?\]\((.+?)\)/g, '<img class="post-img" src="$1" onclick="openLightbox(\'$1\')">')
        .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/\n/g, '<br>');
    return html;
}

function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('active');
}

// 拉 Issues → 帖子
fetch(`https://api.github.com/repos/${REPO}/issues?state=open&per_page=20`)
    .then(res => res.json())
    .then(issues => {
        LOADING.remove();
        if (!Array.isArray(issues) || issues.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'post';
            empty.innerHTML = '<div class="post-text" style="text-align:center;color:#bbb;">还没有帖子，去发第一篇吧 ♡</div>';
            POST_LIST.insertBefore(empty, document.getElementById('gallery'));
            return;
        }
        issues.forEach(issue => {
            if (issue.pull_request) return;
            const article = document.createElement('article');
            article.className = 'post';
            article.innerHTML = `
                <div class="date">${formatDate(issue.created_at)}</div>
                <div class="post-title">${issue.title}</div>
                <div class="post-text">${md2html(issue.body)}</div>
            `;
            POST_LIST.insertBefore(article, document.getElementById('gallery'));
        });
    })
    .catch(() => {
        LOADING.textContent = '加载失败，请刷新重试';
    });

// 拉 gallery 文件夹图片
fetch(`https://api.github.com/repos/${REPO}/contents/gallery`)
    .then(res => res.json())
    .then(files => {
        const grid = document.getElementById('gallery-grid');
        document.getElementById('gallery-loading').remove();
        if (!Array.isArray(files)) {
            grid.innerHTML = '<div style="color:#bbb;font-size:10px;text-align:center;grid-column:1/-1;">暂无图片</div>';
            return;
        }
        files.forEach(file => {
            if (!file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) return;
            const img = document.createElement('img');
            img.src = file.download_url;
            img.alt = file.name;
            img.onclick = () => openLightbox(file.download_url);
            grid.appendChild(img);
        });
    })
    .catch(() => {
        document.getElementById('gallery-loading').textContent = '加载失败';
    });

</script>

<!-- 音乐播放器 + 旋转唱片 -->
<audio id="bgm" loop preload="auto">
  <source src="music/bgm.mp3" type="audio/mpeg">
</audio>

<!-- 唱片 -->
<div id="disc"
  style="position:fixed;right:14px;bottom:52px;z-index:999;
         width:48px;height:48px;border-radius:50%;
         background:radial-gradient(circle,#222 30%,#111 31%,#111 38%,#333 39%,#333 45%,#222 46%);
         border:2px solid #555;display:none;align-items:center;justify-content:center;
         animation:spin 3s linear infinite;animation-play-state:paused;">
  <div style="width:14px;height:14px;border-radius:50%;background:#f0c040;"></div>
</div>

<!-- 按钮 -->
<button id="music-btn"
  style="position:fixed;right:14px;bottom:18px;z-index:999;
         background:rgba(255,255,255,0.85);border:1px solid #ddd;
         border-radius:20px;padding:6px 12px;font-size:11px;cursor:pointer;">
  ♫ 音乐
</button>

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>

<script>
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('music-btn');
  const disc = document.getElementById('disc');
  bgm.volume = 0.4;

  btn.addEventListener('click', () => {
    if (bgm.paused) {
      bgm.play().catch(() => {
        btn.textContent = '♫ 再点一下';
      });
      btn.textContent = '♫ 暂停';
      disc.style.display = 'flex';
      disc.style.animationPlayState = 'running';
    } else {
      bgm.pause();
      btn.textContent = '♫ 音乐';
      disc.style.animationPlayState = 'paused';
      disc.style.display = 'none';
    }
  });
</script>


</body>

</html>
